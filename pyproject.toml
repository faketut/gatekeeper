[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatekeeper"
version = "0.1.0"
description = "Risk-scored payments for AI agents — PayPal AI Hackathon entry"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["gatekeeper*", "agent*"]
